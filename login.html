<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Ultramedia Graphix</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="logo">ULTRAMEDIA GRAPHIX</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="services.html">Services</a>
      <a href="contact.html">Contact</a>
      <a href="login.html" class="active">Login</a>
    </nav>
  </header>

  <div class="login-wrapper">
    <div class="login-box">
      <h2>Welcome Back</h2>

      <form id="loginForm">
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" name="email">
          <span class="error-text" id="emailError"></span>
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" name="password">
          <span class="error-text" id="passwordError"></span>
        </div>

        <button type="submit" class="btn">Log In</button>
      </form>

      <p class="signup-link" style="margin-top: 12px;"><a href="forgot-password.html">Forgot your password?</a></p>
      <p class="signup-link">Don't have an account? <a href="register.html">Sign up</a></p>
    </div>
  </div>

  <footer class="site-footer">
    <p>&copy; 2026 Ultramedia Graphix. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
