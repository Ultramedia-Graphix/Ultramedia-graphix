<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Ultramedia Graphix</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="logo">ULTRAMEDIA GRAPHIX</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="services.html">Services</a>
      <a href="contact.html">Contact</a>
      <a href="login.html">Login</a>
    </nav>
  </header>

  <div class="login-wrapper">
    <div class="login-box">
      <h2>Reset Your Password</h2>
      <p class="helper-text">Enter the email linked to your account. We'll send you a link to reset your password.</p>

      <!--
        NOTE FOR KELVIN: this form only checks that the typed value
        LOOKS like an email. Actually sending a reset email requires
        a backend/auth service — see script.js for where that call
        goes once Supabase/Firebase is connected.
      -->

      <form id="resetForm">
        <div class="form-group">
          <label for="resetEmail">Email</label>
          <input type="email" id="resetEmail" name="email">
          <span class="error-text" id="resetEmailError"></span>
        </div>

        <button type="submit" class="btn">Send Reset Link</button>
      </form>

      <p id="resetSuccessMsg" class="success-text"></p>

      <p class="signup-link"><a href="login.html">Back to login</a></p>
    </div>
  </div>

  <footer class="site-footer">
    <p>&copy; 2026 Ultramedia Graphix. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
