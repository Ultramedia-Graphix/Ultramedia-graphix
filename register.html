<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Ultramedia Graphix</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="logo">ULTRAMEDIA GRAPHIX</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="services.html">Services</a>
      <a href="contact.html">Contact</a>
      <a href="login.html">Login</a>
    </nav>
  </header>

  <div class="login-wrapper">
    <div class="login-box">
      <h2>Create Your Account</h2>

      <!--
        NOTE FOR KELVIN:
        This form validates FORMAT (is it a valid-looking email, do
        passwords match, is the password strong enough). It CANNOT
        check whether this email is already registered — that check
        must happen on a server against a real database. The
        placeholder in script.js shows exactly where that call goes
        once Supabase/Firebase is connected.
      -->

      <form id="registerForm">
        <div class="form-group">
          <label for="regName">Full Name</label>
          <input type="text" id="regName" name="name">
          <span class="error-text" id="regNameError"></span>
        </div>

        <div class="form-group">
          <label for="regEmail">Email</label>
          <input type="email" id="regEmail" name="email">
          <span class="error-text" id="regEmailError"></span>
        </div>

        <div class="form-group">
          <label for="regPassword">Password</label>
          <input type="password" id="regPassword" name="password">
          <span class="error-text" id="regPasswordError"></span>
        </div>

        <div class="form-group">
          <label for="regConfirmPassword">Confirm Password</label>
          <input type="password" id="regConfirmPassword" name="confirmPassword">
          <span class="error-text" id="regConfirmError"></span>
        </div>

        <button type="submit" class="btn">Create Account</button>
      </form>

      <div class="divider"><span>or</span></div>

      <button type="button" class="btn-google" id="googleSignupBtn">
        <img src="images/google-icon.png" alt="" class="google-icon">
        Sign up with Google
      </button>

      <p class="signup-link">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </div>

  <footer class="site-footer">
    <p>&copy; 2026 Ultramedia Graphix. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
