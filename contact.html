<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Ultramedia Graphix</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="logo">ULTRAMEDIA GRAPHIX</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="services.html">Services</a>
      <a href="contact.html" class="active">Contact</a>
      <a href="login.html">Login</a>
    </nav>
  </header>

  <section class="page-banner">
    <div class="hero-bgword">CONTACT</div>
    <div class="hero-content">
      <p class="eyebrow">Let's Talk</p>
      <h1>Start Your Project</h1>
      <p>Tell us a bit about what you need — we'll get back to you shortly.</p>
    </div>
  </section>

  <section class="content-section">
    <div class="login-wrapper" style="min-height: auto; background: none; padding: 0 0 40px 0;">
      <div class="login-box" style="max-width: 500px;">
        <h2>Send a Message</h2>

        <form id="contactForm">
          <div class="form-group">
            <label for="contactName">Your Name</label>
            <input type="text" id="contactName" name="name">
            <span class="error-text" id="contactNameError"></span>
          </div>

          <div class="form-group">
            <label for="contactEmail">Your Email</label>
            <input type="email" id="contactEmail" name="email">
            <span class="error-text" id="contactEmailError"></span>
          </div>

          <div class="form-group">
            <label for="contactMessage">Message</label>
            <textarea id="contactMessage" name="message" rows="5"></textarea>
            <span class="error-text" id="contactMessageError"></span>
          </div>

          <button type="submit" class="btn">Send Message</button>
        </form>

        <p id="contactSuccessMsg" class="success-text"></p>
      </div>
    </div>
  </section>

  <footer class="site-footer">
    <p>&copy; 2026 Ultramedia Graphix. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
